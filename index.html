<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Calendário de Aniverssário</title>
</head>

<body>
    <main>
        <h1>Cadastro de Pessoas</h1>
        <form action="" class="form js-form">
            <label for="name">Nome:
                <input class="form-field js-field" type="text" name="name" required id="name" maxlength="120">
            </label>
            <label for="birth-date">
                Data de nascimento:
                <input class="form-field js-field" type="date" name="birth-date" required id="birth-date">
            </label>
            <div class="btn">
                <button type="submit" class="submit">Salvar</button><button class="clean" type="reset">Limpar</button>
            </div>

        </form>
    </main>

    <script src="./script.js"></script>
</body>

</html>
