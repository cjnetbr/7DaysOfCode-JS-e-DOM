<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

  <link rel="stylesheet" href="./style.css" />
  <title>Calendário de Aniverssário</title>
</head>

<body>
  <header>
    <h1>Meus Aniversários</h1>
  </header>
  <main>
    <section class="form-cadastro">
      <form action="" class="form js-form">
        <label for="name">Nome da Pessoa: (Campo Obrigatório)
          <input class="form-field js-field" type="text" name="name" required id="name" minlength="3" maxlength="120"
            pattern="^[A-Za-zÀ-ÿ\s]+$" title="O nome deve conter apenas letra e ter entre3 e 120 caracters."
            placeholder="Digite o nome da pessoa aqui ex: José da Silva" />

        </label>
        <label for="birth-date">
          Data de nascimento: (Campo Obrigatório)
          <input class="form-field js-field" type="text" name="birth-date" placeholder="Ex: 31/01/2021" required
            pattern="^(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[0-2])/([0-9]{4})$"
            title="Digite uma data válida no formato DD/MM/AAAA (ex: 31/01/2021)." id="birth-date" />

        </label>
        <div class="btn">
          <button type="submit" class="submit" id="submit">Salvar</button>
          <button class="clean" type="reset">Limpar</button>
        </div>
      </form>
      <p class="js-msg msg"></p>
    </section>
    <section class="lista-cadastrados">
      <table id="table-js">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Data de Nascimento</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="listarPessoas">
          <tr>

        </tbody>
      </table>
    </section>


  </main>

  <script src="./script.js"></script>
</body>

</html>
